# Despliegue en Render (plan gratuito): un solo servicio que entrega la página y la API.
services:
  - type: web
    name: saiyagym
    runtime: node
    plan: free
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend && npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: ZONA_HORARIA
        value: America/Bogota
      - key: DATABASE_URL
        sync: false   # pega aquí la URL de Neon (paso 1 de docs/DESPLIEGUE.md)
